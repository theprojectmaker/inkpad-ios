# The scan cleanup on sample pictures, with Apple's real filters (about a minute).
# The results come back as the "scan-check" download.
name: Scan cleanup check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run
        run: |
          mkdir -p build out
          cp scripts/scan-check.swift build/Check.swift
          cp modules/quill-canvas/ios/ScanFilter.swift build/
          xcrun swiftc -parse-as-library -O -sdk "$(xcrun --sdk macosx --show-sdk-path)" build/Check.swift build/ScanFilter.swift -o build/check
          ./build/check scripts/scan-samples out
      - uses: actions/upload-artifact@v4
        with:
          name: scan-check
          path: out
          retention-days: 7
