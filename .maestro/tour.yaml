# A walk through Quill on an iPad simulator: library, a new note, writing with a
# finger, undo, pen options, scrolling, adding pages, the page sidebar, Study,
# Calculator, Classroom, Clock. Each step takes a screenshot; steps are optional
# so one miss doesn't stop the tour (the screenshots show what happened).
appId: com.solyapps.notes
---
- launchApp:
    clearState: true
- extendedWaitUntil: { visible: "All Notes", timeout: 60000 }
- takeScreenshot: 01-library
- tapOn: "New"
- extendedWaitUntil: { visible: "Lined note", timeout: 5000, optional: true }
- takeScreenshot: 02-new-menu
- tapOn: { text: "Lined note", optional: true }
- extendedWaitUntil: { visible: "More", timeout: 8000, optional: true }
- takeScreenshot: 03-editor
# Fingers write (the simulator has no Apple Pencil)
- tapOn: { text: "More", optional: true }
- tapOn: { text: "Draw with finger", optional: true }
- waitForAnimationToEnd
- swipe: { start: "25%, 35%", end: "60%, 37%", duration: 500 }
- swipe: { start: "25%, 40%", end: "55%, 46%", duration: 500 }
- swipe: { start: "30%, 50%", end: "40%, 30%", duration: 400 }
- takeScreenshot: 04-ink
- tapOn: { text: "Undo.*", optional: true }
- takeScreenshot: 05-after-undo
# Pen options: tap the picked pen again
- tapOn: { text: "Pen", optional: true }
- waitForAnimationToEnd
- takeScreenshot: 06-pen-options
- tapOn: { text: "Close pen options", optional: true }
# Highlighter, eraser, typed text
- tapOn: { text: "Highlighter", optional: true }
- swipe: { start: "25%, 36%", end: "60%, 38%", duration: 500 }
- tapOn: { text: "Eraser", optional: true }
- swipe: { start: "45%, 30%", end: "45%, 52%", duration: 500 }
- takeScreenshot: 06b-highlight-erase
- tapOn: { text: "Text", optional: true }
- tapOn: { point: "40%, 62%" }
- inputText: "Hello from the test"
- tapOn: { point: "70%, 80%" }
- takeScreenshot: 06c-text
- tapOn: { text: "Pen", optional: true }
# Fingers scroll again; add two pages
- tapOn: { text: "More", optional: true }
- tapOn: { text: "Draw with finger", optional: true }
- tapOn: { text: "More", optional: true }
- tapOn: { text: "Add a page at the end", optional: true }
- tapOn: { text: "More", optional: true }
- tapOn: { text: "Add a page at the end", optional: true }
- waitForAnimationToEnd
- swipe: { start: "50%, 80%", end: "50%, 25%", duration: 600 }
- waitForAnimationToEnd
- takeScreenshot: 07-scrolled
# Tapping the very top of the screen must not jump back to page 1
- tapOn: { point: "50%, 1%" }
- waitForAnimationToEnd
- takeScreenshot: 08-after-top-tap
- tapOn: { text: "Show pages", optional: true }
- waitForAnimationToEnd
- takeScreenshot: 09-page-sidebar
- tapOn: { text: "Hide pages", optional: true }
- tapOn: { text: "Study with AI", optional: true }
- waitForAnimationToEnd
- takeScreenshot: 10-study
- tapOn: { text: "Close study", optional: true }
- tapOn: { text: "Calculator", optional: true }
- takeScreenshot: 11a-calculator-opening
- waitForAnimationToEnd: { timeout: 8000 }
- takeScreenshot: 11-calculator-panel
- tapOn: { text: "Hide calculator", optional: true }
- tapOn: { text: "Back to notes", optional: true }
- waitForAnimationToEnd
- takeScreenshot: 12-library-after
- tapOn: { text: "Classroom", optional: true }
- waitForAnimationToEnd
- takeScreenshot: 13-classroom
- tapOn: { text: "Back to notes", optional: true }
- tapOn: { text: "Clock", optional: true }
- waitForAnimationToEnd
- takeScreenshot: 14-clock
