# The scan fixer: import a dim, grainy, unevenly lit photo of a worksheet,
# then "Clean up this page", "Make it black and white", and back to the original.
appId: com.solyapps.notes
---
- launchApp:
    clearState: true
- extendedWaitUntil: { visible: "All Notes", timeout: 60000 }
- tapOn: "New"
- extendedWaitUntil: { visible: "Import photos", timeout: 5000, optional: true }
- tapOn: { text: "Import photos", optional: true }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: f01-picker
- extendedWaitUntil: { visible: "zzz-never-shown", timeout: 3000, optional: true }
- tapOn: { point: "45%, 38%" }
- extendedWaitUntil: { visible: "zzz-never-shown", timeout: 2000, optional: true }
- tapOn: { point: "81%, 32%" }
- tapOn: { text: "Add", optional: true }
- extendedWaitUntil: { visible: "More", timeout: 60000, optional: true }
- waitForAnimationToEnd
- takeScreenshot: f02-imported
- tapOn: { text: "More", optional: true }
- tapOn: { text: "Clean up this page", optional: true }
- waitForAnimationToEnd: { timeout: 8000 }
- takeScreenshot: f03-fixed-color
- tapOn: { text: "More", optional: true }
- tapOn: { text: "Make it black and white", optional: true }
- waitForAnimationToEnd: { timeout: 8000 }
- takeScreenshot: f04-fixed-bw
- tapOn: { text: "More", optional: true }
- tapOn: { text: "Back to the original photo", optional: true }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: f05-original
