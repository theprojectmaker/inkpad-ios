# The page cleanup inside the app, on pictures the workflow left for the app to import:
# clean up, black and white, back to the original; zoomed in to see the small print.
appId: com.solyapps.notes
---
- launchApp
- extendedWaitUntil: { visible: "All Notes", timeout: 60000 }
- extendedWaitUntil: { visible: "doc-dim", timeout: 300000 }
- extendedWaitUntil: { visible: "THeavy60.*", timeout: 300000 }
- tapOn: { text: "doc-dim" }
- extendedWaitUntil: { visible: "More", timeout: 20000 }
- waitForAnimationToEnd
- takeScreenshot: f02-imported
- tapOn: { text: "More", optional: true }
- takeScreenshot: f02b-menu
- tapOn: { text: "Clean up this page", optional: true }
- waitForAnimationToEnd: { timeout: 10000 }
- extendedWaitUntil: { visible: "zzz-never-shown", timeout: 6000, optional: true }
- takeScreenshot: f03-fixed-color
- tapOn: { text: "More", optional: true }
- tapOn: { text: "Make it black and white", optional: true }
- extendedWaitUntil: { visible: "zzz-never-shown", timeout: 8000, optional: true }
- takeScreenshot: f04-fixed-bw
- tapOn: { text: "More", optional: true }
- tapOn: { text: "Back to the original photo", optional: true }
- extendedWaitUntil: { visible: "zzz-never-shown", timeout: 5000, optional: true }
- takeScreenshot: f05-original
- tapOn: { text: "Back to notes", optional: true }
- waitForAnimationToEnd
- takeScreenshot: f06-library
